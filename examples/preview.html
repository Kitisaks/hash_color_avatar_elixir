<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HashColorAvatar examples</title>
<style>
  body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #fff; color: #16171d; }
  main { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; color: #3a3d4a; font-size: 14px; max-width: 65ch; }
  .paper, .chrome { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; padding: 16px; border-radius: 12px; }
  .paper { background: #f4f4f6; }
  .chrome { background: #262830; color: #f4f4f6; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  figcaption { font-size: 12px; }
  .paper figcaption { color: #3a3d4a; }
  .chrome figcaption { color: #f4f4f6; }
  .disc { line-height: 0; }
  .btn { width: 48px; height: 48px; border-radius: 9999px; overflow: hidden; background: #fff; border: 1px solid #cfd1db; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .btn svg { display: block; width: 48px; height: 48px; }
</style>
</head>
<body>
<main>

  <p>Minimal discs, the variant Tatex embeds. White initials, Inter, sizes used in the admin.</p>
